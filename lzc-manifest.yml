application:
  subdomain: netwatch
  background_task: true
  routes:
    - /=http://proxy:23088
services:
  netwatch:
    image: embed:netwatch
    network_mode: host
    environment:
      - PORT=23087
      - REFRESH_INTERVAL_SEC=10
      - BROADBAND_TEST_SEC=10
      - LOCAL_TRANSFER_TEST_SEC=10
      - LOCAL_TRANSFER_PAYLOAD_MB=32
      - DATA_DIR=/app/data
    binds:
      - /lzcapp/var/data:/app/data
  proxy:
    image: embed:netwatch
    command: /app/netwatch-proxy
    depends_on:
      - netwatch
    environment:
      - LISTEN_PORT=23088
      - TARGET_PORT=23087
    healthcheck:
      test:
        - CMD
        - /app/netwatch-proxy
        - -healthcheck
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
