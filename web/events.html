<!DOCTYPE html>
<html lang="zh-CN" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a0b">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' *;">
    <title data-i18n="events_page_title">NETWATCH // 网络事件中心</title>
    <link rel="icon" href="/icons/lzc-icon.png" type="image/png">
    <script>
        var savedTheme = localStorage.getItem('theme');
        if (!savedTheme) savedTheme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
    <script src="/i18n.js" defer></script>
    <link rel="stylesheet" href="/app.css?v=system-typography-1">
</head>
<body>
    <div class="container traffic-page events-page">
        <header class="traffic-topbar">
            <div class="traffic-header-copy">
                <div class="logo">NET<span>WATCH</span></div>
                <!-- <div class="note traffic-page-subtitle" data-i18n="events_page_subtitle">网络变化与配置操作记录</div> -->
            </div>
            <div class="controls">
                <a class="button-link btn-with-icon" href="/"><span class="ui-icon ui-icon--back" aria-hidden="true"></span><span data-i18n="back_to_dashboard">返回仪表盘</span></a>
                <button id="events-refresh-btn" class="icon-button" type="button" title="刷新" aria-label="刷新" data-i18n-title="refresh_btn" data-i18n-aria-label="refresh_btn"><span class="ui-icon ui-icon--refresh" aria-hidden="true"></span></button>
            </div>
        </header>

        <main class="events-layout">
            <section class="events-toolbar" aria-label="事件筛选">
                <input id="events-search-input" type="search" autocomplete="off" data-i18n-placeholder="events_search_placeholder" placeholder="搜索事件、设备或状态" aria-label="搜索事件">
                <select id="events-severity-filter" aria-label="严重度">
                    <option value="" data-i18n="events_all_severities">全部级别</option>
                    <option value="warning" data-i18n="events_warning">警告</option>
                    <option value="info" data-i18n="events_info">信息</option>
                </select>
                <select id="events-kind-filter" aria-label="事件类型">
                    <option value="" data-i18n="events_all_kinds">全部类型</option>
                </select>
                <select id="events-range-filter" aria-label="时间范围">
                    <option value="24h" data-i18n="range_24_h">24 小时</option>
                    <option value="7d" data-i18n="events_range_7d">7 天</option>
                    <option value="30d" data-i18n="events_range_30d">30 天</option>
                    <option value="all" data-i18n="range_all">全部</option>
                </select>
                <span id="events-status" class="placeholder"></span>
            </section>

            <section class="events-timeline" id="events-timeline" aria-live="polite">
                <div class="events-loading" data-i18n="loading">加载中...</div>
            </section>
        </main>
    </div>

    <script src="/shared.js" defer></script>
    <script src="/api.js" defer></script>
    <script src="/events.js" defer></script>
</body>
</html>
