<!DOCTYPE html>
<html lang="zh-CN" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="traffic_page_title">NETWATCH // 应用流量分析</title>
    <script>
        document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');
    </script>
    <script src="/vendor/lazycat-sdk.js" defer></script>
    <script src="/i18n.js" defer></script>
    <link rel="stylesheet" href="/app.css">
</head>
<body>
    <div id="toast" class="toast"></div>
    <div class="container traffic-page">
        <header>
            <div class="traffic-header-copy">
                <div class="logo">NET<span>WATCH</span></div>
                <div class="note" id="traffic-page-note" data-i18n="traffic_page_subtitle">应用流量分析</div>
            </div>
            <div class="controls">
                <button id="theme-toggle" title="切换深浅模式" data-i18n-title="toggle_theme_title">🌓</button>
                <button id="lang-toggle" title="中文/English" data-i18n-title="toggle_lang_title">🌐</button>
                <a class="button-link" href="/" data-i18n="back_to_dashboard">返回仪表盘</a>
                <button id="traffic-refresh-btn" data-i18n="refresh_btn">刷新</button>
            </div>
        </header>

        <main class="traffic-layout">
            <section class="card traffic-sidebar">
                <div class="card-title">
                    <span data-i18n="app_list_title">应用列表</span>
                    <span class="placeholder" id="traffic-list-status" data-i18n="loading">加载中</span>
                </div>
                <div class="traffic-toolbar">
                    <input class="traffic-search" id="traffic-search" placeholder="搜索应用" data-i18n-placeholder="search_app_placeholder">
                    <div class="traffic-toolbar-row">
                        <select class="traffic-select" id="traffic-sort">
                            <option value="total-desc" data-i18n="sort_total_desc">总流量降序</option>
                            <option value="rx-desc" data-i18n="sort_rx_desc">下行降序</option>
                            <option value="tx-desc" data-i18n="sort_tx_desc">上行降序</option>
                            <option value="name-asc" data-i18n="sort_name_asc">名称升序</option>
                        </select>
                        <label class="traffic-check">
                            <input type="checkbox" id="traffic-hide-idle">
                            <span data-i18n="hide_idle">隐藏空闲</span>
                        </label>
                    </div>
                </div>
                <div class="traffic-app-list" id="traffic-app-list"></div>

                <div class="traffic-side-panel">
                    <div class="card-title"><span data-i18n="interval_ranking">区间流量排行</span></div>
                    <table class="traffic-mini-table" id="traffic-top-table"></table>
                </div>
            </section>

            <section class="traffic-main">
                <section class="card traffic-chart-card">
                    <div class="traffic-chart-head">
                        <div class="traffic-chart-title">
                            <h1 id="traffic-selected-title" data-i18n="app_traffic">应用流量</h1>
                            <div class="note" id="traffic-selected-sub" data-i18n="waiting_data">等待数据</div>
                        </div>
                        <div class="traffic-range-controls" id="traffic-range-controls">
                            <button type="button" data-range="1m" data-i18n="range_1_min">1 分钟</button>
                            <button type="button" data-range="5m" data-i18n="range_5_min">5 分钟</button>
                            <button type="button" data-range="15m" data-i18n="range_15_min">15 分钟</button>
                            <button type="button" data-range="1h" class="active" data-i18n="range_1_h">1 小时</button>
                            <button type="button" data-range="6h" data-i18n="range_6_h">6 小时</button>
                            <button type="button" data-range="24h" data-i18n="range_24_h">24 小时</button>
                            <button type="button" data-range="all" data-i18n="range_all">全部</button>
                            <select id="traffic-label-density" title="趋势图时间轴标签密度" data-i18n-title="label_density_title">
                                <option value="0" data-i18n="label_auto">自动标签</option>
                                <option value="3" data-i18n="label_3">每 3 个点</option>
                                <option value="5" data-i18n="label_5">每 5 个点</option>
                                <option value="10" data-i18n="label_10">每 10 个点</option>
                                <option value="20" data-i18n="label_20">每 20 个点</option>
                            </select>
                            <label class="traffic-live-toggle">
                                <input type="checkbox" id="traffic-live-refresh">
                                <span data-i18n="live_refresh">实时刷新</span>
                            </label>
                            <select id="traffic-live-interval" title="实时刷新间隔" data-i18n-title="live_interval_title">
                                <option value="1" data-i18n="sec_1">1 秒</option>
                                <option value="2" data-i18n="sec_2">2 秒</option>
                                <option value="3" data-i18n="sec_3">3 秒</option>
                                <option value="5" data-i18n="sec_5">5 秒</option>
                                <option value="10" data-i18n="sec_10">10 秒</option>
                            </select>
                        </div>
                    </div>

                    <div class="traffic-summary-grid" id="traffic-summary-grid"></div>

                    <div class="traffic-chart-legend" id="traffic-chart-legend"></div>
                    <div class="traffic-chart" id="traffic-chart"></div>
                </section>

                <section class="traffic-detail-grid">
                    <section class="card">
                        <div class="card-title"><span data-i18n="interface_counters">接口计数</span></div>
                        <table class="traffic-mini-table" id="traffic-counter-table"></table>
                    </section>
                    <section class="card">
                        <div class="card-title"><span data-i18n="interval_samples">区间采样</span></div>
                        <table class="traffic-mini-table" id="traffic-sample-table"></table>
                    </section>
                </section>
            </section>
        </main>
    </div>

    <script src="/shared.js" defer></script>
    <script src="/traffic.js" defer></script>
</body>
</html>
