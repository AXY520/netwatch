services:
  netwatch:
    build:
      context: .
      dockerfile: Dockerfile
    image: netwatch:latest
    container_name: netwatch
    # host 网络模式：容器共享宿主机的 network namespace，/proc/net/dev 读到真实网卡统计
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    environment:
      PORT: "8080"
      DATA_DIR: "/app/data"
      REFRESH_INTERVAL_SEC: "10"
      BROADBAND_TEST_SEC: "15"
      LOCAL_TRANSFER_TEST_SEC: "10"
      TZ: "Asia/Shanghai"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
